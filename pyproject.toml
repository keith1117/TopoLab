[project]
name = "topolab"
version = "1.0.0"
description = "Reproducible 3D topology optimization platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Keith Wang" }]
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "pydantic>=2.10",
  "safetensors>=0.6",
  "scipy>=1.14",
  "sqlalchemy>=2.0",
  "torch>=2.8",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx2>=2.0",
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
