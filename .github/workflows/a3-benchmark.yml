name: A3 sparse solver benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/topolab/fem.py
      - src/topolab/simp.py
      - src/topolab/benchmark.py
      - scripts/a3_optimizer_profile.py
      - scripts/a3_benchmark_compare.py
      - .github/workflows/a3-benchmark.yml

jobs:
  sparse-ordering:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Record Linux environment
        run: uname -srm
      - name: Benchmark fixed mesh ladder and fallback
        run: |
          uv run python -m topolab.benchmark --repeated-runs 3 --ordering COLAMD --output "$RUNNER_TEMP/a3-colamd.json"
          uv run python -m topolab.benchmark --repeated-runs 3 --ordering auto --output "$RUNNER_TEMP/a3-auto.json"
          uv run python scripts/a3_benchmark_compare.py "$RUNNER_TEMP/a3-colamd.json" "$RUNNER_TEMP/a3-auto.json"
      - name: Profile complete three-step optimization
        run: |
          uv run python scripts/a3_optimizer_profile.py --ordering COLAMD
          uv run python scripts/a3_optimizer_profile.py --ordering auto
      - uses: actions/upload-artifact@v4
        with:
          name: a3-linux-sparse-ordering
          path: |
            ${{ runner.temp }}/a3-colamd.json
            ${{ runner.temp }}/a3-auto.json
