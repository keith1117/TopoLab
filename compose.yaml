services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    user: "10001:10001"
    expose:
      - "8000"
    volumes:
      - topolab-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/runs', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  topolab-data:
